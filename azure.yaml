# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: serverless-blob-manager
metadata:
  template: serverless-blob-manager@1.0.0

infra:
  provider: bicep
  path: ./infra
  module: main

services:
  func:
    project: ./src/ServerlessBlobManager.Functions
    language: dotnet
    host: function

hooks:
  postdeploy:
    windows:
      shell: pwsh
      run: ./scripts/azd/create-blobdeleted-subscription.ps1
      continueOnError: false
      interactive: false
    posix:
      shell: sh
      run: ./scripts/azd/create-blobdeleted-subscription.sh
      continueOnError: false
      interactive: false
